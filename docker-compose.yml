services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vault
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: vault
    ports:
      - '15432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vault -d vault']
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      target: development
    environment:
      DATABASE_URL: postgresql://vault:vault@postgres:5432/vault
      PORT: 3000
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '3002:3000'
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npm run migration:up && npm run start:dev"

volumes:
  api_node_modules:
